[project]
name = "shoppilot"
version = "0.1.0"
description = "电商智能客服 Agent (FastAPI + LangGraph + DeepSeek + Chroma + Redis)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "shoppilot" }]

dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.30,<0.33",
    "sse-starlette>=2.1,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1,<2",
    "langgraph>=0.2.60,<0.3",
    "langgraph-checkpoint-redis>=0.0.6,<0.1",
    "langchain-core>=0.3.20,<1",
    "langchain-openai>=0.3,<1",
    "langchain-chroma>=0.1.4,<0.2",
    "langchain-huggingface>=0.1,<0.2",
    "langchain-text-splitters>=0.3,<0.4",
    "chromadb>=0.5.15,<0.6",
    "redis>=5,<6",
    "sentence-transformers>=3,<4",
    "tenacity>=9,<10",
    "structlog>=24.4,<25",
    "httpx[socks]>=0.27,<0.29",
    "mammoth>=1.8,<2",
    "pypdf>=5,<6",
    "python-docx>=1.1,<2",
    # --- 以下为 in-tree RAGFlow（rag/ + common/ + deepdoc/）解析层依赖 ---
    # deepdoc.parser 顶层 import
    "beartype>=0.18",
    "pandas>=2",
    "openpyxl>=3.1",
    "xgboost>=2",                # macOS 需先 brew install libomp
    "shapely>=2",
    "pyclipper>=1.3",
    "onnxruntime>=1.18",
    "huggingface-hub>=0.24",
    "json-repair>=0.30",
    # rag/nlp 中文分词
    "infinity-sdk>=0.6",         # 提供 RagTokenizer 基类
    "roman-numbers>=1",
    "word2number>=1.1",
    "cn2an>=0.5",
    "strenum>=0.4",
    "markdown>=3.5",
    "nltk>=3.9",
    "hanziconv>=0.3",
    "xpinyin>=0.7",
    "chardet>=5",
    # 各 deepdoc parser 后端
    "python-pptx>=1",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.10",
    "beautifulsoup4>=4.12",
    "ebooklib>=0.18",
    "readabilipy>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "fakeredis[asyncio]>=2.25,<3",
    "respx>=0.21,<0.22",
    "ruff>=0.7,<0.8",
    "httpx>=0.27,<0.29",
    "reportlab>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shoppilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008", "UP007", "UP035", "UP038"]
